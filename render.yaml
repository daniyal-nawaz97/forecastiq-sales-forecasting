services:
  - type: web
    name: forecastiq
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_WHATSAPP
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
